# TechScreen feature flags — source of truth (constitution §16, FR-005).
#
# Every flag the project has ever had appears in this file: active flags drive
# runtime behaviour, sunset flags stay forever to preserve audit history
# (FR-011, §1). The schema is committed at docs/contracts/feature-flag.schema.json
# and enforced on every commit by scripts/check-feature-flag-registration.py.
#
# To add a flag:        add an entry with state=active + at least one
#                       is_enabled("name") call site in app/backend/.
# To flip a flag:        PR that changes default=false → default=true (mostly
#                       documentation — operators flip the DB row directly via
#                       the sync workflow or emergency SQL).
# To sunset a flag:      flip state to "sunset", set sunset_pr + sunset_date,
#                       add a row to docs/engineering/feature-flags.md
#                       Sunset table. The entry never leaves this file.
#
# See docs/engineering/feature-flags.md for the human-readable index.

flags:
  # Demonstration sunset entry — shipped intentionally so the format is
  # concrete from day one and the bidirectional registration hook
  # (scripts/check-feature-flag-registration.py) has a baseline to validate
  # against. This name is reserved and must never be reused.
  - name: example_demonstration
    owner: "@andrii"
    default: false
    default_value: null
    description: "Demonstration entry showing the sunset-row shape; never wired to a call site, never re-introduced."
    state: sunset
    sunset_pr: "#9"
    sunset_date: "2026-04-28"

  # T13 — gates the Position Template CRUD API (/position-templates). Default
  # false: the endpoints are dark (require_crud_enabled → 404) until an operator
  # flips the DB row. is_enabled falls back to this default until then.
  - name: position_template_crud_enabled
    owner: "@andrii"
    default: false
    default_value: null
    description: "Gates the /position-templates CRUD API (T13). Off by default (§9 dark-launch); flip the DB row to expose the endpoints."
    state: active

  # T21 — gates ENFORCEMENT of the per-session cost ceiling (constitution §12).
  # Off by default: the pre-call guard logs a structured warning and the session
  # continues. On: the guard raises SessionBudgetExceeded, the shell aborts the
  # session with ABORTED(cost_ceiling) and appends a session_decision row.
  - name: enforce_session_cost_ceiling
    owner: "@andrii"
    default: false
    default_value: null
    description: "Enforces the per-session USD ceiling from configs/llm-limits.yaml (T21, §12). Off by default (§9 dark-launch) — the guard warns instead of aborting."
    state: active

  # T22 — gates the dev-only session API over the T20 orchestrator. Off by
  # default: /api/dev/sessions* answers 404-as-if-absent. This is the §9
  # exposure point the orchestrator itself deliberately lacked (spec 032
  # Clarification 5).
  - name: enable_live_orchestrator
    owner: "@andrii"
    default: false
    default_value: null
    description: "Gates the dev-only session API over the live orchestrator (T22). Off by default (§9 dark-launch); routes return 404 until the DB row is flipped."
    state: active
