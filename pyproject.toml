[project]
name = "techscreen"
version = "0.0.0"
description = "TechScreen — internal AI technical interview system (backend)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<0.120",
  "uvicorn[standard]>=0.32,<0.36",
  "structlog>=24.4,<25",
  "pyyaml>=6.0,<7",
  # 030: bumped 0.x → 2.x for `response_json_schema` (raw JSON-Schema
  # transport; exists since 1.22.0). 0.8.0's `response_schema` transformer
  # rejected every committed prompt schema pre-network. The bump also
  # removed google-api-core: 2.x raises `google.genai.errors.*` + httpx
  # transport errors, so nothing imports `google.api_core` any more.
  "google-genai>=2.16,<3",
  # 030: `app/backend/llm/_real_backend.py` catches httpx transport
  # exceptions directly (google-genai 2.x transport layer); already in
  # the closure as a base dep of google-genai. Tests reuse it (TestClient).
  "httpx>=0.28,<0.29",
  # T07: Identity Platform ID-token verification (google.auth.jwt against the
  # securetoken certs). Already in the closure as a base dep of google-genai;
  # declared because app/backend/services/auth.py imports it directly. Its
  # base deps include cryptography (the RS256 backend).
  "google-auth>=2.45,<3",
  "tenacity>=9.0,<10",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "alembic>=1.13,<2",
  "asyncpg>=0.30,<0.31",
  "jsonschema>=4.23,<5",
  "openpyxl>=3.1,<4",
]

[dependency-groups]
dev = [
  "ruff>=0.7,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "types-PyYAML>=6.0,<7",
  "pytest-asyncio>=0.23,<1",
  # T07: test-only RSA keypair generation for locally-minted ID tokens
  # (no committed key material). Already present as google-auth's RS256
  # backend; declared because tests import it directly.
  "cryptography>=44,<48",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "node_modules", "app/frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/backend/tests", "infra/functions"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
namespace_packages = true
mypy_path = "."
# Target directory is passed on the CLI (see contracts/dev-commands.md Command 1);
# declaring `files` here would make an empty target error because mypy treats an
# explicit `files` list as "must find these". Leaving it implicit lets the CLI
# argument drive discovery so an empty `app/backend/` still exits 0.

# google-genai 2.x ships `py.typed` — no override needed (the 0.x-era
# `ignore_missing_imports` block was removed in 030).

# jsonschema (4.x) and asyncpg both lack a `py.typed` marker. Treat them as
# untyped at the module boundary — the FeatureFlagService (T05a) is itself
# fully typed at its public surface.
[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*", "asyncpg", "asyncpg.*"]
ignore_missing_imports = true

# openpyxl (3.x) ships without a `py.typed` marker; the RubricImporter (T08)
# is the only consumer and is itself fully typed at its public surface.
[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true
